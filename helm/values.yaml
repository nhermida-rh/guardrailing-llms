# Default values for guardrailing-llms.

# Namespace will be automatically set by Helm to {{ .Release.Namespace }}

# Main LLM
mainLLM:
  name: llama-32-3b-instruct
  storageUri: "oci://quay.io/redhat-ai-services/modelcar-catalog:llama-3.2-3b-instruct"
  image: "quay.io/modh/vllm@sha256:db766445a1e3455e1bf7d16b008f8946fcbe9f277377af7abb81ae358805e7e2"
  port: 8080
  
  # Enhanced vLLM features
  enableAutoToolChoice: true
  enableChunkedPrefill: true
  toolCallParser: llama3_json
  chatTemplate: /app/data/template/tool_chat_template_llama3.2_json.jinja
  maxModelLen: 32768
  maxNumSeqs: 8
  
  # Optional GPU tolerations
  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: "True"
      effect: NoSchedule

# Detectors
detectors:
  # Set to true to request nvidia.com/gpu for detector InferenceServices (default: false)
  useGpu: false
  gibberish:
    storageUri: "oci://quay.io/mmurakam/model-cars:gibberish-text-detector-v0.1.1"
    threshold: 0.35
    port: 8000
  promptInjection:
    storageUri: "oci://quay.io/mmurakam/model-cars:deberta-v3-base-prompt-injection-v2-v0.1.0"
    threshold: 0.5
    port: 8000
  hateAndProfanity:
    storageUri: "oci://quay.io/mmurakam/model-cars:granite-guardian-hap-38m-v0.1.0"
    threshold: 0.5
    port: 8000
  regex:
    # Upstream TrustyAI built-in detector (replaces the broken RHOAI 3.5 sidecar)
    image: "quay.io/trustyai/guardrails-detector-built-in@sha256:cb9ede3538c44823800d2ffbbc65939292ad3591c1e064935c5edde6fee469f4"
    port: 8080
    # Regex detectors applied by the gateway. The SSN detector is named
    # "us-social-security-number" ("ssn" is silently ignored).
    patterns:
      - email
      - us-social-security-number

# Orchestrator
orchestrator:
  replicas: 1
  port: 8032

# Workbench configuration
workbench:
  enabled: true
  name: guardrails-workbench
  # Workbench image. When "tag" is empty, the chart picks the tag marked as
  # recommended in the ImageStream (falls back to "fallbackTag").
  image:
    imageStream: s2i-minimal-notebook
    namespace: redhat-ods-applications
    tag: ""
    fallbackTag: "3.5"
    displayName: "Jupyter | Minimal | CPU | Python 3.12"
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      cpu: "2"
      memory: 4Gi
  storage:
    size: 5Gi
  # Repository cloned into the workbench on first start
  gitRepo:
    enabled: true
    url: https://github.com/nhermida-rh/guardrailing-llms.git
    branch: main
