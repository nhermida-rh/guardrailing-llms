{{- if .Values.workbench.enabled }}
{{- $image := include "workbench.image" . }}
---
# Workbench for OpenShift AI 3.x. The "inject-auth" annotation makes the notebook
# controller add the kube-rbac-proxy sidecar, route and network policies.
apiVersion: kubeflow.org/v1
kind: Notebook
metadata:
  name: {{ .Values.workbench.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    notebooks.opendatahub.io/inject-auth: "true"
    notebooks.opendatahub.io/last-image-selection: {{ printf "%s:%s" .Values.workbench.image.imageStream (include "workbench.imageTag" .) | quote }}
    opendatahub.io/image-display-name: {{ .Values.workbench.image.displayName | quote }}
    openshift.io/display-name: {{ .Values.workbench.name }}
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app: {{ .Values.workbench.name }}
    opendatahub.io/dashboard: "true"
    opendatahub.io/odh-managed: "true"
spec:
  template:
    spec:
      {{- if .Values.workbench.gitRepo.enabled }}
      initContainers:
        # Clones the demo repository into the workbench storage on first start
        - name: clone-repo
          image: {{ $image }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              REPO_DIR=/opt/app-root/src/{{ base .Values.workbench.gitRepo.url | trimSuffix ".git" }}
              if [ -d "$REPO_DIR/.git" ]; then
                echo "Repository already present at $REPO_DIR"
              else
                git clone --branch {{ .Values.workbench.gitRepo.branch }} {{ .Values.workbench.gitRepo.url }} "$REPO_DIR"
              fi
          volumeMounts:
            - name: {{ .Values.workbench.name }}-storage
              mountPath: /opt/app-root/src
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      {{- end }}
      containers:
        - name: {{ .Values.workbench.name }}
          image: {{ $image }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8888
              name: notebook-port
              protocol: TCP
          resources:
            requests:
              cpu: {{ .Values.workbench.resources.requests.cpu | quote }}
              memory: {{ .Values.workbench.resources.requests.memory }}
            limits:
              cpu: {{ .Values.workbench.resources.limits.cpu | quote }}
              memory: {{ .Values.workbench.resources.limits.memory }}
          readinessProbe:
            httpGet:
              path: /notebook/{{ .Release.Namespace }}/{{ .Values.workbench.name }}/api
              port: notebook-port
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /notebook/{{ .Release.Namespace }}/{{ .Values.workbench.name }}/api
              port: notebook-port
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: {{ .Values.workbench.name }}-storage
              mountPath: /opt/app-root/src
            - name: shm
              mountPath: /dev/shm
          workingDir: /opt/app-root/src
          env:
            - name: NOTEBOOK_ARGS
              value: |-
                --ServerApp.port=8888
                --ServerApp.token=''
                --ServerApp.password=''
                --ServerApp.base_url=/notebook/{{ .Release.Namespace }}/{{ .Values.workbench.name }}
                --ServerApp.quit_button=False
            - name: JUPYTER_IMAGE
              value: {{ $image | quote }}
      volumes:
        - name: {{ .Values.workbench.name }}-storage
          persistentVolumeClaim:
            claimName: {{ .Values.workbench.name }}-storage
        - name: shm
          emptyDir:
            medium: Memory
{{- end }}
