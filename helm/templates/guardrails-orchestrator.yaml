---
apiVersion: trustyai.opendatahub.io/v1alpha1
kind: GuardrailsOrchestrator
metadata:
  name: gorch-sample
  namespace: {{ .Release.Namespace }}
spec:
  # The built-in detector sidecar is broken on OpenShift AI 3.5; the standalone
  # regex-detector deployment (templates/regex-detector.yaml) replaces it.
  enableBuiltInDetectors: false
  enableGuardrailsGateway: true
  guardrailsGatewayConfig: fms-orchestr8-config-gateway
  orchestratorConfig: fms-orchestr8-config-nlp
  otelExporter: {}
  replicas: {{ .Values.orchestrator.replicas }}