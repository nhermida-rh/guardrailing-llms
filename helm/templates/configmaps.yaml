---
# Orchestrator configuration.
# NOTE: on OpenShift AI 3.x the KServe RawDeployment predictor Services are headless
# (clusterIP: None), so the orchestrator must target the container ports directly
# (8080 for vLLM, 8000 for the HF detectors) instead of the Service port 80.
kind: ConfigMap
apiVersion: v1
metadata:
  name: fms-orchestr8-config-nlp
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |
    chat_generation:
      service:
        hostname: {{ .Values.mainLLM.name }}-predictor.{{ .Release.Namespace }}.svc.cluster.local
        port: {{ .Values.mainLLM.port }}
    detectors:
      regex:
        type: text_contents
        service:
          hostname: regex-detector.{{ .Release.Namespace }}.svc.cluster.local
          port: {{ .Values.detectors.regex.port }}
        chunker_id: whole_doc_chunker
        default_threshold: 0.5
      hap:
        type: text_contents
        service:
          hostname: ibm-hate-and-profanity-detector-predictor.{{ .Release.Namespace }}.svc.cluster.local
          port: {{ .Values.detectors.hateAndProfanity.port }}
        chunker_id: whole_doc_chunker
        default_threshold: {{ .Values.detectors.hateAndProfanity.threshold }}
      prompt_injection:
        type: text_contents
        service:
          hostname: prompt-injection-detector-predictor.{{ .Release.Namespace }}.svc.cluster.local
          port: {{ .Values.detectors.promptInjection.port }}
        chunker_id: whole_doc_chunker
        default_threshold: {{ .Values.detectors.promptInjection.threshold }}
      gibberish:
        type: text_contents
        service:
          hostname: gibberish-detector-predictor.{{ .Release.Namespace }}.svc.cluster.local
          port: {{ .Values.detectors.gibberish.port }}
        chunker_id: whole_doc_chunker
        default_threshold: {{ .Values.detectors.gibberish.threshold }}
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: fms-orchestr8-config-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app: fmstack-nlp
data:
  config.yaml: |
    orchestrator:
      host: "localhost"
      port: {{ .Values.orchestrator.port }}
    detectors:
      - name: regex
        input: true
        output: true
        detector_params:
          regex:
            {{- toYaml .Values.detectors.regex.patterns | nindent 12 }}
      - name: hap
        input: true
        output: true
        detector_params: {}
      - name: prompt_injection
        input: true
        output: false
        detector_params: {}
      - name: gibberish
        input: true
        output: true
        detector_params: {}
    routes:
      - name: all
        detectors:
          - regex
          - hap
          - prompt_injection
          - gibberish
      - name: passthrough
        detectors:
